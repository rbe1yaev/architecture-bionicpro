version: '3.8'

x-airflow-common: &airflow-common
  build:
    context: ./airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: bionicpro-dev-secret
    AIRFLOW_CONN_CRM_DB: postgres://crm_user:crm_password@crm_db:5432/crm_db
    AIRFLOW_CONN_TELEMETRY_DB: postgres://telemetry_user:telemetry_password@telemetry_db:5432/telemetry_db
    AIRFLOW_CONN_CLICKHOUSE_REPORTS: http://airflow:airflow_password@clickhouse:8123/reports
  volumes:
    - ./airflow/dags:/opt/airflow/dags
  depends_on:
    airflow_db:
      condition: service_healthy

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_KEYCLOAK_URL: http://localhost:8080
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend

  # --- Задание 2: сервис отчётов ---
  reports-api:
    build:
      context: ./reports-api
    environment:
      ADDR: ":8000"
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DATABASE: reports
      CLICKHOUSE_USER: reports_api
      CLICKHOUSE_PASSWORD: reports_api_password
      # iss совпадает с адресом Keycloak, через который браузер получает токен
      OIDC_ISSUER: http://localhost:8080/realms/reports-realm
      # ключи подписи сервис читает по адресу Keycloak внутри docker-сети
      OIDC_JWKS_URL: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs
      OIDC_ALLOWED_AZP: reports-frontend
      REQUIRED_ROLE: prothetic_user
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - clickhouse
      - keycloak

  # --- Задание 2: источники данных, OLAP и Airflow ---
  crm_db:
    image: postgres:16.0
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    volumes:
      - ./airflow/sql/crm/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5434:5432"
  telemetry_db:
    image: postgres:16.0
    environment:
      POSTGRES_DB: telemetry_db
      POSTGRES_USER: telemetry_user
      POSTGRES_PASSWORD: telemetry_password
    volumes:
      - ./airflow/sql/telemetry/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5435:5432"
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: reports
      CLICKHOUSE_USER: airflow
      CLICKHOUSE_PASSWORD: airflow_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./airflow/sql/clickhouse:/docker-entrypoint-initdb.d:ro
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  airflow_db:
    image: postgres:16.0
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname BionicPRO --role Admin --email admin@example.com
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      crm_db:
        condition: service_started
      telemetry_db:
        condition: service_started
      clickhouse:
        condition: service_started
